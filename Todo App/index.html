<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <style>
        #inputWrapper{
            padding: 10px 0;
        }
        #inputWrapper input{
            width: 595px;
            height: 30px;
        }
        #listWrapper{
            width: 600px;
            height: 400px;
            border: 1px solid #ccc;
        }
        .todoItem{
            width: 100%;
            height: 30px;
            margin: 2px 0;
            background-color:#f0eaea;
            display: flex;
            padding:0 10px;
            box-sizing: border-box;
            cursor: pointer;
            align-items: center;
        }
        .todoItem span{
            width: 100%;
            padding-left: 10px;
        }
        .todoItem.completed span{
            text-decoration: line-through;
        }
        .todoItem input, button{
            cursor: pointer;
        }

    </style>
</head>
<body>
    <section id = 'description'>
        Todo webpage created. Follow <a href = 'https://www.youtube.com/' target = '_blank'>channel</a> for javascript tutorial.
    </section>
    <section id = 'todoList'> TodoList </section>
    <script src = './index.js'></script>
</body>
</html>
