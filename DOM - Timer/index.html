<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>

    <style>
        body {
            display: flex;
            align-items: center;
        }
        #timer {  
            display: flex;         
            width: 100%;   
            justify-content: center;
            align-items: baseline;
        }
        .min-count, .sec-count {
            font-size: 80px;

        }
        .min-suffix, .sec-suffix {
            font-size: 30px;
            margin-right: 20px;
        }
        
    </style>

</head>
<body>
    <div id = "timer">
        <span class = "min-count">--</span>
        <span class = "min-suffix">m</span>
        <span class = "sec-count">--</span>
        <span class = "sec-suffix">s</span>
    </div>
    <!-- <script src = "./index.js"></script> -->
</body>
</html>
